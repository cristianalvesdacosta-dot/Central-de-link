<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Links</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.25)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.5)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        .phone-frame {
            width: 100%;
            max-width: 390px;
            min-height: 720px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 10px #18181b;
            position: relative;
            overflow: hidden;
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 24px;
            background-color: #18181b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- BARRA DO EDITOR (Oculta por padrão para os clientes) -->
    <header id="adminHeader" class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 px-4 py-3 hidden">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-lg">
                    <i data-lucide="link-2" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-base text-white">Painel de Edição</h1>
                    <span class="text-[10px] text-emerald-400 font-medium">● Modo Administrador Ativo</span>
                </div>
            </div>

            <!-- Botões de Controle -->
            <div class="flex items-center gap-2">
                <button onclick="exportConfig()" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg flex items-center gap-1" title="Fazer Backup">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Backup</span>
                </button>
                <label class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg flex items-center gap-1 cursor-pointer" title="Restaurar Backup">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Restaurar</span>
                    <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importConfig(event)">
                </label>
                <button onclick="lockAdminMode()" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg shadow-lg flex items-center gap-1">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i> Salvar e Sair
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

        <!-- PAINEL DE EDICÃO (Esquerda - Só aparece quando desbloqueado com senha) -->
        <aside id="editorPanel" class="w-full lg:w-[480px] border-r border-slate-800 bg-slate-900/80 flex flex-col h-[calc(100vh-61px)] overflow-y-auto hidden">
            
            <!-- Abas do Editor -->
            <div class="flex border-b border-slate-800 bg-slate-900 sticky top-0 z-20">
                <button onclick="switchTab('profile')" id="tab-profile" class="flex-1 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-500 flex items-center justify-center gap-1">
                    <i data-lucide="user" class="w-3.5 h-3.5"></i> Perfil
                </button>
                <button onclick="switchTab('design')" id="tab-design" class="flex-1 py-3 text-xs font-semibold text-slate-400 flex items-center justify-center gap-1">
                    <i data-lucide="palette" class="w-3.5 h-3.5"></i> Design
                </button>
                <button onclick="switchTab('links')" id="tab-links" class="flex-1 py-3 text-xs font-semibold text-slate-400 flex items-center justify-center gap-1">
                    <i data-lucide="list-plus" class="w-3.5 h-3.5"></i> Links
                </button>
                <button onclick="switchTab('social')" id="tab-social" class="flex-1 py-3 text-xs font-semibold text-slate-400 flex items-center justify-center gap-1">
                    <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Sociais
                </button>
            </div>

            <div class="p-5 space-y-5 flex-1">

                <!-- ABA PERFIL -->
                <div id="content-profile" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-medium text-slate-300">Banner de Topo</label>
                        <input type="file" id="bannerUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'banner')">
                        <label for="bannerUpload" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-dashed border-slate-700 bg-slate-800/50 hover:bg-slate-800 cursor-pointer text-xs text-slate-300">
                            <i data-lucide="image" class="w-4 h-4 text-blue-400"></i> Alterar Banner
                        </label>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-medium text-slate-300">Foto de Perfil / Logo</label>
                        <input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'avatar')">
                        <label for="avatarUpload" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-dashed border-slate-700 bg-slate-800/50 hover:bg-slate-800 cursor-pointer text-xs text-slate-300">
                            <i data-lucide="upload-cloud" class="w-4 h-4 text-blue-400"></i> Enviar Imagem / Logo
                        </label>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-medium text-slate-300">Nome ou Marca</label>
                        <input type="text" id="inputName" oninput="updateProfileData()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-medium text-slate-300">Biografia / Slogan</label>
                        <textarea id="inputBio" oninput="updateProfileData()" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 resize-none"></textarea>
                    </div>
                </div>

                <!-- ABA DESIGN -->
                <div id="content-design" class="space-y-4 hidden">
                    <div class="space-y-2">
                        <label class="text-xs font-medium text-slate-300">Estilo do Fundo</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setBgType('gradient')" class="p-2 bg-slate-800 border border-slate-700 rounded-lg text-xs">Gradiente</button>
                            <button onclick="setBgType('solid')" class="p-2 bg-slate-800 border border-slate-700 rounded-lg text-xs">Cor Sólida</button>
                        </div>
                    </div>

                    <div id="bgGradientConfig" class="grid grid-cols-2 gap-2">
                        <button onclick="setGradientPreset('from-slate-950 via-slate-900 to-slate-950')" class="h-8 rounded bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border border-slate-700"></button>
                        <button onclick="setGradientPreset('from-blue-900 via-indigo-950 to-slate-950')" class="h-8 rounded bg-gradient-to-r from-blue-900 via-indigo-950 to-slate-950 border border-slate-700"></button>
                        <button onclick="setGradientPreset('from-purple-900 via-slate-900 to-slate-950')" class="h-8 rounded bg-gradient-to-r from-purple-900 via-slate-900 to-slate-950 border border-slate-700"></button>
                        <button onclick="setGradientPreset('from-emerald-900 via-teal-950 to-slate-950')" class="h-8 rounded bg-gradient-to-r from-emerald-900 via-teal-950 to-slate-950 border border-slate-700"></button>
                    </div>
                </div>

                <!-- ABA LINKS -->
                <div id="content-links" class="space-y-4 hidden">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-400">Gerenciar Botões</span>
                        <button onclick="addNewLink()" class="px-2.5 py-1 text-xs bg-blue-600 text-white rounded-lg flex items-center gap-1">+ Novo Botão</button>
                    </div>
                    <div id="linksList" class="space-y-3"></div>
                </div>

                <!-- ABA SOCIAIS -->
                <div id="content-social" class="space-y-3 hidden">
                    <input type="text" id="socialWhatsapp" oninput="updateSocials()" placeholder="WhatsApp (https://wa.me/...)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs">
                    <input type="text" id="socialInstagram" oninput="updateSocials()" placeholder="Instagram (https://instagram.com/...)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs">
                    <input type="text" id="socialTelegram" oninput="updateSocials()" placeholder="Telegram" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs">
                </div>

            </div>
        </aside>

        <!-- ÁREA PÚBLICA (Onde fica o telemóvel bonito para os clientes) -->
        <section class="flex-1 bg-slate-950 flex items-center justify-center p-4 lg:p-8 min-h-screen">
            
            <div class="phone-frame flex flex-col bg-slate-900 border border-slate-800">
                <div class="phone-notch"></div>
                
                <div id="previewCard" class="w-full h-full flex-1 flex flex-col justify-between p-6 relative bg-cover bg-center">
                    
                    <div class="relative z-10 w-full flex flex-col items-center">
                        
                        <!-- Banner -->
                        <div id="previewBannerContainer" class="w-full -mx-6 -mt-6 mb-6 h-28 hidden overflow-hidden">
                            <img id="previewBanner" src="" class="w-full h-full object-cover">
                        </div>

                        <!-- Foto de Perfil -->
                        <div class="relative mb-3 mt-2">
                            <img id="previewAvatar" src="https://placehold.co/150x150/1e293b/ffffff?text=Logo" class="w-20 h-20 object-cover border-2 border-white/20 rounded-full shadow-xl">
                        </div>

                        <!-- Nome e Bio -->
                        <h2 id="previewName" class="font-display font-bold text-lg text-center text-white mb-1">Seu Nome</h2>
                        <p id="previewBio" class="text-xs text-center text-slate-300 max-w-xs mb-6 leading-relaxed">Biografia ou slogan da sua empresa.</p>

                        <!-- Links -->
                        <div id="previewLinks" class="w-full space-y-3 mb-6"></div>
                    </div>

                    <!-- Rodapé do Perfil -->
                    <div class="relative z-10 w-full pt-4 border-t border-white/10 flex flex-col items-center gap-3">
                        <div id="previewSocials" class="flex items-center justify-center gap-3"></div>
                        
                        <!-- BOTÃO DISCRETO PARA O DONO EDITAR -->
                        <button onclick="openPasswordModal()" class="text-[10px] text-slate-600 hover:text-slate-400 mt-2 transition-all">
                            ⚙️ Área do Administrador
                        </button>
                    </div>

                </div>
            </div>

        </section>

    </main>

    <!-- MODAL DE SENHA DE ACESSO -->
    <div id="passwordModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full text-center space-y-4">
            <h3 class="text-sm font-bold text-white">Acesso do Administrador</h3>
            <p class="text-xs text-slate-400">Insira a senha do painel para editar o site:</p>
            <input type="password" id="adminPasswordInput" placeholder="Senha (Padrão: 1234)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-center text-sm text-white focus:outline-none focus:border-blue-500">
            <div class="flex gap-2">
                <button onclick="closePasswordModal()" class="flex-1 py-2 text-xs bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
                <button onclick="checkPassword()" class="flex-1 py-2 text-xs bg-blue-600 text-white font-bold rounded-xl">Entrar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA COMPLETO -->
    <script>
        let appConfig = {
            adminPassword: '1234', // Senha padrão para acessar a edição
            profile: {
                name: 'Sua Marca / Perfil',
                bio: 'Centralize todos os seus links em um único lugar interativo.',
                avatar: 'https://placehold.co/150x150/3b82f6/ffffff?text=Logo',
                banner: ''
            },
            design: {
                bgType: 'gradient',
                bgGradient: 'from-blue-900 via-indigo-950 to-slate-950',
                bgColor: '#0f172a'
            },
            links: [
                { id: 1, title: 'Nosso Website Oficial', subtitle: 'Conheça nossos produtos', url: 'https://google.com', icon: 'globe', bgColor: '#2563eb' },
                { id: 2, title: 'Falar no WhatsApp', subtitle: 'Atendimento Rápido', url: 'https://wa.me/', icon: 'message-circle', bgColor: '#059669' }
            ],
            socials: { whatsapp: '', instagram: '', telegram: '' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            renderAll();
        });

        // AUTENTICAÇÃO E MODOS DE EXIBIÇÃO
        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('adminPasswordInput').focus();
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
        }

        function checkPassword() {
            const input = document.getElementById('adminPasswordInput').value;
            if (input === appConfig.adminPassword) {
                closePasswordModal();
                unlockAdminMode();
            } else {
                alert("Senha incorreta!");
            }
        }

        function unlockAdminMode() {
            document.getElementById('adminHeader').classList.remove('hidden');
            document.getElementById('editorPanel').classList.remove('hidden');
        }

        function lockAdminMode() {
            saveConfig();
            document.getElementById('adminHeader').classList.add('hidden');
            document.getElementById('editorPanel').classList.add('hidden');
            alert("Alterações salvas com sucesso!");
        }

        // SALVAMENTO LOCAL
        function saveConfig() {
            localStorage.setItem('link_central_saved_data', JSON.stringify(appConfig));
        }

        function loadConfig() {
            const saved = localStorage.getItem('link_central_saved_data');
            if (saved) {
                try { appConfig = JSON.parse(saved); } catch(e){}
            }
        }

        // NAVEGAÇÃO DE ABAS
        function switchTab(tab) {
            ['profile', 'design', 'links', 'social'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
        }

        // RENDERIZAÇÃO GERAL
        function renderAll() {
            document.getElementById('inputName').value = appConfig.profile.name;
            document.getElementById('inputBio').value = appConfig.profile.bio;
            renderLinksEditor();
            renderPreview();
        }

        function updateProfileData() {
            appConfig.profile.name = document.getElementById('inputName').value;
            appConfig.profile.bio = document.getElementById('inputBio').value;
            saveConfig();
            renderPreview();
        }

        function handleImageUpload(e, target) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                if (target === 'avatar') appConfig.profile.avatar = evt.target.result;
                if (target === 'banner') appConfig.profile.banner = evt.target.result;
                saveConfig();
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function setBgType(type) {
            appConfig.design.bgType = type;
            saveConfig();
            renderPreview();
        }

        function setGradientPreset(preset) {
            appConfig.design.bgGradient = preset;
            saveConfig();
            renderPreview();
        }

        function renderLinksEditor() {
            const container = document.getElementById('linksList');
            container.innerHTML = '';
            appConfig.links.forEach((link) => {
                const item = document.createElement('div');
                item.className = "bg-slate-800/80 p-3 rounded-xl space-y-2 border border-slate-700";
                item.innerHTML = `
                    <div class="flex justify-between text-xs font-bold text-slate-300">
                        <span>${link.title}</span>
                        <button onclick="deleteLink(${link.id})" class="text-red-400">Excluir</button>
                    </div>
                    <input type="text" value="${link.title}" oninput="updateLink(${link.id}, 'title', this.value)" class="w-full bg-slate-900 p-1.5 rounded text-xs">
                    <input type="text" value="${link.url}" oninput="updateLink(${link.id}, 'url', this.value)" class="w-full bg-slate-900 p-1.5 rounded text-xs text-blue-400">
                `;
                container.appendChild(item);
            });
        }

        function addNewLink() {
            appConfig.links.push({ id: Date.now(), title: 'Novo Botão', subtitle: '', url: 'https://', icon: 'link', bgColor: '#2563eb' });
            saveConfig();
            renderAll();
        }

        function deleteLink(id) {
            appConfig.links = appConfig.links.filter(l => l.id !== id);
            saveConfig();
            renderAll();
        }

        function updateLink(id, field, value) {
            const link = appConfig.links.find(l => l.id === id);
            if (link) { link[field] = value; saveConfig(); renderPreview(); }
        }

        function updateSocials() {
            appConfig.socials.whatsapp = document.getElementById('socialWhatsapp').value;
            appConfig.socials.instagram = document.getElementById('socialInstagram').value;
            appConfig.socials.telegram = document.getElementById('socialTelegram').value;
            saveConfig();
            renderPreview();
        }

        function renderPreview() {
            const card = document.getElementById('previewCard');
            const avatar = document.getElementById('previewAvatar');
            const name = document.getElementById('previewName');
            const bio = document.getElementById('previewBio');
            const links = document.getElementById('previewLinks');
            const bannerContainer = document.getElementById('previewBannerContainer');
            const banner = document.getElementById('previewBanner');

            card.className = "w-full h-full flex-1 flex flex-col justify-between p-6 relative bg-cover bg-center";
            if (appConfig.design.bgType === 'gradient') {
                card.className += ` bg-gradient-to-br ${appConfig.design.bgGradient}`;
            } else {
                card.style.backgroundColor = appConfig.design.bgColor;
            }

            if (appConfig.profile.banner) {
                banner.src = appConfig.profile.banner;
                bannerContainer.classList.remove('hidden');
            } else {
                bannerContainer.classList.add('hidden');
            }

            avatar.src = appConfig.profile.avatar;
            name.innerText = appConfig.profile.name;
            bio.innerText = appConfig.profile.bio;

            links.innerHTML = '';
            appConfig.links.forEach(l => {
                const a = document.createElement('a');
                a.href = l.url;
                a.target = "_blank";
                a.className = "w-full py-3 px-4 rounded-xl flex items-center justify-between glass-card text-white text-xs font-semibold hover:bg-white/25 transition-all";
                a.innerHTML = `<span>${l.title}</span><i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>`;
                links.appendChild(a);
            });

            lucide.createIcons();
        }

        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appConfig, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `backup_central_links.json`;
            a.click();
        }

        function importConfig(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                appConfig = JSON.parse(evt.target.result);
                saveConfig();
                renderAll();
                alert("Backup restaurado!");
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
