<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Links</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin-top: 20px;
    }

    /* VISTA PÚBLICA (O que os clientes veem) */
    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .banner {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: -40px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--card-bg);
      object-fit: cover;
      position: relative;
      background-color: #334155;
    }

    h1 {
      font-size: 22px;
      margin-top: 10px;
      color: var(--text);
    }

    p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 5px;
      padding: 0 10px;
    }

    .link-btn {
      display: block;
      width: 100%;
      background-color: var(--card-bg);
      color: var(--text);
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #334155;
      transition: transform 0.2s, background-color 0.2s;
    }

    .link-btn:hover {
      background-color: #2b3b52;
      transform: translateY(-2px);
    }

    /* PAINEL ADMINISTRATIVO (Só aparece quando fazes login) */
    .admin-panel {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      margin-top: 30px;
      border: 1px dashed var(--accent);
    }

    .hidden {
      display: none !important;
    }

    input, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .admin-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-logout {
      background-color: #ef4444;
      color: white;
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-del {
      background-color: #ef4444;
      color: white;
      width: auto;
      padding: 4px 8px;
      font-size: 11px;
    }

    .link-item-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    /* Rodapé com botão secreto de login para ti */
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- CABEÇALHO PÚBLICO (Visível para todos) -->
    <div class="profile-header">
      <!-- Podes alterar a imagem de fundo e o avatar aqui diretamente -->
      <img src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500" alt="Banner" class="banner">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Avatar" class="avatar">
      <h1>Sua Marca / Perfil</h1>
      <p>Centralize todos os seus links em um único lugar interativo e profissional.</p>
    </div>

    <!-- LISTA DE LINKS PÚBLICOS (Onde os clientes clicam) -->
    <div id="public-links-list">
      <!-- Os links cadastrados aparecem aqui automaticamente -->
    </div>

    <!-- PAINEL DE CONTROLE (Só aparece se estiveres logado) -->
    <div id="admin-section" class="admin-panel hidden">
      <div class="admin-controls">
        <h3>Painel de Gestão</h3>
        <button class="btn-logout" id="btn-logout">Sair</button>
      </div>

      <form id="add-link-form">
        <input type="text" id="link-title" placeholder="Nome do Botão (ex: WhatsApp)" required>
        <input type="url" id="link-url" placeholder="URL (https://...)" required>
        <button type="submit">+ Adicionar Novo Link</button>
      </form>

      <div style="margin-top: 15px; font-size: 13px; color: var(--text-sub);">Links Atuais:</div>
      <div id="admin-links-list" style="margin-top: 5px;"></div>
    </div>

    <!-- ÁREA DE LOGIN (Discreta no rodapé para entrares quando quiseres alterar algo) -->
    <footer>
      <div id="login-trigger">
        <a href="#" id="show-login-btn">Área Administrativa</a>
      </div>
      
      <div id="login-form-container" class="hidden" style="margin-top: 15px;">
        <form id="login-form">
          <input type="email" id="login-email" placeholder="E-mail" required>
          <input type="password" id="login-password" placeholder="Senha" required>
          <button type="submit">Entrar no Painel</button>
        </form>
      </div>
    </footer>

  </div>

  <!-- SCRIPT DO FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // A tua configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAJl7AX6LI4LdPW0XfeXLiAieyprfuUhAI",
      authDomain: "cental-de-link.firebaseapp.com",
      projectId: "cental-de-link",
      storageBucket: "cental-de-link.firebasestorage.app",
      messagingSenderId: "1024805588951",
      appId: "1:1024805588951:web:af91f30db97d17f6a90592",
      measurementId: "G-KD8863JGYY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const adminSection = document.getElementById('admin-section');
    const loginTrigger = document.getElementById('login-trigger');
    const loginFormContainer = document.getElementById('login-form-container');
    const loginForm = document.getElementById('login-form');
    const btnLogout = document.getElementById('btn-logout');
    
    const publicLinksList = document.getElementById('public-links-list');
    const adminLinksList = document.getElementById('admin-links-list');
    const addLinkForm = document.getElementById('add-link-form');

    // Mostrar formulário de login ao clicar no rodapé
    document.getElementById('show-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      loginFormContainer.classList.toggle('hidden');
    });

    // Fazer Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
        loginFormContainer.classList.add('hidden');
      } catch (err) {
        alert("Erro ao entrar: " + err.message);
      }
    });

    // Logout
    btnLogout.addEventListener('click', () => signOut(auth));

    // Vigiar se estás logado ou não
    onAuthStateChanged(auth, (user) => {
      if (user) {
        adminSection.classList.remove('hidden');
        loginTrigger.classList.add('hidden');
        loadLinks(true); // Carrega modo admin
      } else {
        adminSection.classList.add('hidden');
        loginTrigger.classList.remove('hidden');
        loadLinks(false); // Carrega modo público
      }
    });

    // Adicionar Link
    addLinkForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "links"), {
          title: document.getElementById('link-title').value,
          url: document.getElementById('link-url').value,
          createdAt: new Date()
        });
        document.getElementById('link-title').value = '';
        document.getElementById('link-url').value = '';
        loadLinks(true);
      } catch (err) {
        alert("Erro ao salvar: " + err.message);
      }
    });

    // Carregar Links (para o público e para o painel)
    async function loadLinks(isAdmin) {
      try {
        const querySnapshot = await getDocs(collection(db, "links"));
        
        publicLinksList.innerHTML = '';
        if(isAdmin) adminLinksList.innerHTML = '';

        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const docId = docSnap.id;

          // Renderiza para o público
          const a = document.createElement('a');
          a.className = 'link-btn';
          a.href = item.url;
          a.target = '_blank';
          a.innerText = item.title;
          publicLinksList.appendChild(a);

          // Renderiza no painel de administração se logado
          if (isAdmin) {
            const div = document.createElement('div');
            div.className = 'link-item-admin';
            div.innerHTML = `
              <span>${item.title}</span>
              <button class="btn-del" onclick="window.deleteLinkItem('${docId}')">Excluir</button>
            `;
            adminLinksList.appendChild(div);
          }
        });
      } catch (e) {
        publicLinksList.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nenhum link cadastrado ainda.</p>';
      }
    }

    // Função global para excluir link
    window.deleteLinkItem = async (id) => {
      if (confirm("Deseja apagar este link?")) {
        await deleteDoc(doc(db, "links", id));
        loadLinks(true);
      }
    };

    // Carregar links ao iniciar a página
    loadLinks(false);
  </script>
</body>
</html>
